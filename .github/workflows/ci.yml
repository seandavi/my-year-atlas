name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch upstream data drift
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site

  data-assertions:
    # Full pipeline incl. the world alive<=births assertion (spec §12).
    # Only when the pipeline changes or on the weekly run — it downloads ~145MB.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ' '), 'scripts/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: wpp2024-raw-v1
      - name: Install DuckDB CLI
        run: |
          curl -sL https://github.com/duckdb/duckdb/releases/download/v1.3.2/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: ./scripts/build.sh

  pages-deploy:
    # keeps the GitHub Pages preview current on every push to main
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build -- --base=/my-year-atlas/ && touch dist/.nojekyll
        working-directory: site
      - name: Push to gh-pages
        run: |
          cd site/dist
          git init -b gh-pages
          git add -A
          git -c user.email=actions@github.com -c user.name="github-actions" commit -m "Pages deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

  deploy-production:
    # full-stack deploy to year-atlas.seandavis.net on every push to main
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: production-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm run build
        working-directory: site
      - run: npm ci
        working-directory: worker
      - run: node --test test/*.test.js
        working-directory: worker
      - run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pr-preview:
    # every PR gets its own full-stack preview URL (Workers version preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm run build
        working-directory: site
      - run: npm ci
        working-directory: worker
      - run: node --test test/*.test.js
        working-directory: worker
      - name: Upload preview version
        id: preview
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload 2>&1 | tee /tmp/wrangler.out
          url=$(grep -oE 'https://[a-z0-9-]+-year-atlas\.[a-z0-9-]+\.workers\.dev' /tmp/wrangler.out | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none \
            --body "Full-stack preview for this PR: ${{ steps.preview.outputs.url }} (share cards at \`/og?y=1971\` work there too)"
